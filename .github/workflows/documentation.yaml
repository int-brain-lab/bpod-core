name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/documentation.yaml'
      - 'docs/**'
      - 'bpod_core/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.14
          enable-cache: true
      - run: sudo apt-get install -y graphviz
      - uses: actions/cache@v6
        with:
          path: docs/build/.doctrees
          key: sphinx-${{ runner.os }}-${{ hashFiles('uv.lock', 'docs/source/conf.py') }}
          restore-keys: |
            sphinx-${{ runner.os }}-
      - name: build documentation
        env:
          UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
          UMAMI_SITE_ID: ${{ vars.UMAMI_SITE_ID }}
        run: uv run --no-default-groups --group doc sphinx-build -b dirhtml docs/source docs/build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  context7:
    name: Trigger Context7 rescan
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CONTEXT7_LIBRARY_NAME: ${{ vars.CONTEXT7_LIBRARY_NAME }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
    steps:
      - name: Request documentation refresh
        run: |
          if [ -z "$CONTEXT7_LIBRARY_NAME" ] || [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::error::variable CONTEXT7_LIBRARY_NAME or secret CONTEXT7_API_KEY is not set"
            exit 1
          fi
          curl -sS --fail-with-body -X POST https://context7.com/api/v1/refresh \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"libraryName\": \"$CONTEXT7_LIBRARY_NAME\"}"
