name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/documentation.yaml'
      - 'docs/**'
      - 'bpod_core/**'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: 3.14
          enable-cache: true
      - run: sudo apt-get install -y graphviz
      - name: build documentation
        env:
          UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
          UMAMI_SITE_ID: ${{ vars.UMAMI_SITE_ID }}
        run: uv run --no-default-groups --group doc sphinx-build -b dirhtml docs/source docs/build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  context7:
    name: Trigger Context7 rescan
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CONTEXT7_LIBRARY_NAME: ${{ vars.CONTEXT7_LIBRARY_NAME }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
    steps:
      - name: Request documentation refresh
        run: |
          if [ -z "$CONTEXT7_LIBRARY_NAME" ] || [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::error::variable CONTEXT7_LIBRARY_NAME or secret CONTEXT7_API_KEY is not set"
            exit 1
          fi
          curl -sS --fail-with-body -X POST https://context7.com/api/v1/refresh \
            -H "Authorization: Bearer $CONTEXT7_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"libraryName\": \"$CONTEXT7_LIBRARY_NAME\"}"
