name: Publish to PyPI
on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  check:
    name: Verify package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(uv version --short)
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package version '$PKG_VERSION'"
            exit 1
          fi

  test:
    name: Run CI
    needs: check
    uses: ./.github/workflows/main.yaml

  build:
    name: Build and upload release to PyPi
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bpod-core
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uv publish

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: |
          # Define variables
          PRERELEASE_FLAG=$([[ "${GITHUB_REF_NAME}" =~ (a|b|rc) ]] && echo "--prerelease")
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          PREV_VERSION=$(gh release list --limit 2 | tail -1 | awk '{print $1}')

          # Extract release notes & append link to full changelog
          awk "/^## \[${GITHUB_REF_NAME}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
          echo -e "\n**Full Changelog**: $REPO_URL/compare/$PREV_VERSION...${GITHUB_REF_NAME}" >> release-notes.md

          # Create release
          gh release create ${GITHUB_REF_NAME} --notes-file release-notes.md --verify-tag $PRERELEASE_FLAG
