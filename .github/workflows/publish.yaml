name: Publish to PyPI
on:
  workflow_dispatch:
  push:
    tags:
      - '+([0-9]).+([0-9]).+([0-9])?(@(a|b|rc)*([0-9]))'  # Matches PEP440 version tags

jobs:
  test:
    name: Run CI
    uses: ./.github/workflows/main.yaml

  build:
    name: Build and upload release to PyPi
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bpod-core
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.13
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(uv version --short)
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag '$TAG_VERSION' does not match package version '$PKG_VERSION'"
            exit 1
          fi
      - name: Verify CHANGELOG.md
        if: github.event_name == 'push'
        run: |
          VERSION="${{ github.ref_name }}"
          TODAY=$(date +%Y-%m-%d)
          if ! grep -q "^## \[$VERSION\] - $TODAY" CHANGELOG.md; then
            echo "Error: Version $VERSION with today's date ($TODAY) not found in CHANGELOG.md"
            exit 1
          fi
      - run: uv build
      - run: uv publish
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk "/^## \[${{ github.ref_name }}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
          PRERELEASE_FLAG=""
          if [[ "${{ github.ref_name }}" =~ (a|b|rc) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create ${{ github.ref_name }} \
            --notes-file release-notes.md \
            --verify-tag \
            $PRERELEASE_FLAG
