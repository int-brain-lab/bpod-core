name: unit tests
on:
  workflow_call:
    inputs:
      release:
        description: Run the release checks (lockfile, version and changelog)
        type: boolean
        default: false
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [ ready_for_review, opened, synchronize ]
    paths-ignore:
      - 'docs/**'

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.base_ref == 'main') || inputs.release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Verify lockfile
        run: |
          uv lock --check || (echo "::error file=uv.lock::uv.lock is not up to date" && exit 1)
      - name: Verify package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION=$(uv version --short)
          PREV_VERSION=$(gh release list --limit 1 | awk '{print $1}')
          if [ "$PKG_VERSION" = "$PREV_VERSION" ]; then
            echo "::error file=CHANGELOG.md::Package version $PKG_VERSION must be different from previous version $PREV_VERSION"
            exit 1
          fi
      - name: Verify CHANGELOG.md
        run: |
          PKG_VERSION=$(uv version --short)
          TODAY=$(date +%Y-%m-%d)
          if ! grep -q "^## \[$PKG_VERSION\] - $TODAY" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG must have version $PKG_VERSION with today's date ($TODAY)"
            exit 1
          fi
  quality:
    name: "ruff & mypy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
      - run: ruff format --check
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          prune-cache: true
      - name: sync dependencies
        run: uv sync --no-default-groups --group tox
      - run: uv run tox -m 'typing' --fail-fast -p --parallel-no-spinner
  tox:
    needs: [quality]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
    steps:
      - name: Install libegl1 (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libegl1
          version: 1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          prune-cache: true
      - name: sync dependencies
        run: uv sync --no-default-groups --group tox --group ci
      - name: run tox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tox --skip-env 'linting|formatting|typing' --fail-fast -p --parallel-no-spinner -- -ci
  finish:
    needs: tox
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          parallel-finished: true
