name: unit tests
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [ ready_for_review, opened, synchronize ]
    paths-ignore:
      - 'docs/**'

jobs:
  version:
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.base_ref == 'main') || github.event_name == 'workflow_call'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Verify lockfile
        run: |
          uv lock --check || (echo "::error file=uv.lock::uv.lock is not up to date" && exit 1)
      - name: Verify package version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION=$(uv version --short)
          PREV_VERSION=$(gh release list --limit 1 | awk '{print $1}')
          if [ "$PKG_VERSION" = "$PREV_VERSION" ]; then
            echo "::error file=CHANGELOG.md::Package version $PKG_VERSION must be different from previous version $PREV_VERSION"
            exit 1
          fi
      - name: Verify CHANGELOG.md
        run: |
          PKG_VERSION=$(uv version --short)
          TODAY=$(date +%Y-%m-%d)
          if ! grep -q "^## \[$PKG_VERSION\] - $TODAY" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG must have version $PKG_VERSION with today's date ($TODAY)"
            exit 1
          fi
  tox:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: sync dependencies
        run: uv sync --no-default-groups --group test --group ci
      - name: run tox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tox --parallel-no-spinner -- -ci
  finish:
    needs: tox
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true
