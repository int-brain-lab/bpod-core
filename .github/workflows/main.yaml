name: unit tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [ ready_for_review, opened, synchronize ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  tox:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ "ubuntu-latest", "windows-latest", "macos-latest" ]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Verify CHANGELOG.md
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.base_ref == 'main'
        run: |
          PKG_VERSION=$(uv version --short)
          TODAY=$(date +%Y-%m-%d)
          if ! grep -q "^## \[$PKG_VERSION\] - $TODAY" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG must have version $PKG_VERSION with today's date ($TODAY)"
            exit 1
          fi
      - name: sync dependencies
        run: uv sync --no-default-groups --group test --group ci
      - name: run tox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run tox --parallel-no-spinner -- -ci
  finish:
    needs: tox
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          parallel-finished: true
