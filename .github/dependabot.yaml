version: 2

updates:
  - package-ecosystem: uv
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: weekly
      day: monday
      time: "08:00"

    labels:
      - "dependencies"

    open-pull-requests-limit: 5

    # only update uv.lock: pyproject.toml holds the tested minimum versions
    versioning-strategy: lockfile-only

    cooldown:
      default-days: 7

    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    rebase-strategy: auto

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: weekly
      day: monday
      time: "08:00"

    labels:
      - "dependencies"

    open-pull-requests-limit: 3

    cooldown:
      default-days: 7

    groups:
      github-actions:
        patterns:
          - "*"

    rebase-strategy: auto
