[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "bpod-core"
version = '0.1.0a7'
description = "Python package for interfacing with the Bpod finite state machine"
authors = [{ name = "Florian Rau", email = "bimac@users.noreply.github.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy",
  "pydantic>=2.0",
  "pyserial>=3.5",
  "graphviz>=0.20.0",
  "pyzmq>=27.0.0",
  "zeroconf>=0.147.0",
  "msgspec>=0.19.0",
  "packaging>=25.0",
  "pyyaml>=6.0.0",
  "platformdirs>=4.4.0",
  "filelock>=3.20.0",
  "psutil>=7.0.0",
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    {include-group = "doc"},
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typing"},
]
doc = [
  "myst-parser>=4.0.1",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-copybutton>=0.5.2",
  "sphinx-rtd-theme>=3.0.2",
  "sphinx<=8.2.3",
  "sphinx-jsonschema>=1.19.1",
  "sphinx-design>=0.6.1",
  "sphinx-toolbox>=4.0.0",
  "sphinx-github-style>=1.2.2",
]
lint = [
  "ruff>=0.9.2",
]
test = [
  {include-group = "typing"},
  {include-group = "lint"},
  "pytest-cov>=6.1.1",
  "pytest>=8.3.5",
  "ruff>=0.11.5",
  "tox>=4.25.0",
  "tox-uv>=0.7.2",
  "packaging>=25.0",
  "pytest-mock>=3.14.1",
]
typing = [
  "appdirs-stubs>=0.1.0",
  "docutils-stubs>=0.0.22",
  "mypy>=1.15.0",
  "types-docutils>=0.22.0",
  "types-psutil>=7.0.0",
  "types-pyserial>=3.5.0",
  "types-pyyaml>=6.0.0",
]
ci = [
  "coveralls>=4.0.1",
  "pytest-github-actions-annotate-failures>=0.3.0",
]

[project.urls]
Changelog = "https://github.com/int-brain-lab/bpod-core/blob/main/CHANGELOG.md"
Documentation = "https://int-brain-lab.github.io/bpod-core/"
Homepage = "https://github.com/int-brain-lab/bpod-core"
Issues = "https://github.com/int-brain-lab/bpod-core/issues"
Repository = "https://github.com/int-brain-lab/bpod-core.git"

[tool.uv]
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'linux'",
  "sys_platform == 'darwin'",
]

[tool.uv.build-backend]
module-name = "bpod_core"
module-root = ""
source-include = [
  "tests/*.py",
  "schema/*.json",
  "docs/source/**/*",
  "examples/**/*"
]
source-exclude = [
  "docs/source/api",
  "docs/source/state_machines/*.svg",
  "docs/source/state_machines/examples"
]

[tool.ruff]
include = ["bpod_core/**/*.py", "tests/**/*.py", "examples/**/*.py", "docs/source/**/*.py"]
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "E",    # pycodestyle Error
  "F",    # Pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "NPY",  # NumPy-specific rules
  "PERF", # Perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "T20",  # flake8-print
  "TID",  # flake8-tidy-imports
  "TC",   # flake8-type-checking
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle Warning
]
ignore = [
  "TRY003",  # Avoid specifying long messages outside the exception class
  "Q000",    # Single quotes found but double quotes preferred
  "Q003",    # Change outer quotes to avoid escaping inner quotes
  "D105",    # Missing docstring in magic method
  "D401",    # First line of docstring should be in imperative mood
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments
  "PLR0915", # Too many statements
  "PLR2004", # Magic value used in comparison, consider replacing with a constant variable
  "ANN401"   # Dynamically typed expressions (typing.Any) are disallowed in {name}
]

[tool.ruff.lint.per-file-ignores]
"!bpod_core/**.py" = [
  "ANN",     # flake8-annotations
  "D",       # pydocstyle
  "FBT",     # flake8-boolean-trap
]
"!tests/**.py" = [
  "PT"       # flake8-pytest-style
]
"tests/**.py" = [
  "ARG001",  # Unused function argument
  "ARG002",  # Unused method argument
  "PERF",    # Perflint
  "S101",    # Use of assert detected
  "S104",    # Possible binding to all interfaces
  "SLF001"   # private-member-access
]
"docs/**.py" = [
  "S102",    # Use of `exec` detected
  "SLF001"   # private-member-access
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
packages = [ "bpod_core", "tests" ]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source_pkgs = [ "bpod_core" ]
relative_files = true

[tool.pytest.ini_options]
addopts = "--cov=bpod_core --doctest-modules"
testpaths = ["tests/", "bpod_core/"]
