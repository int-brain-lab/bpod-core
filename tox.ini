[tox]
requires = tox >= 4.25.0
env_list = linting{posargs}, formatting, typing-py31{0-4}, doctest, clean, py31{0-4}{posargs}, combine

[testenv]
dependency_groups = test
runner = uv-venv-lock-runner
setenv =
   COVERAGE_FILE = .coverage.{py_dot_ver}
   COVERALLS_FLAG_NAME = {on_platform}_python{py_dot_ver}
   COVERALLS_PARALLEL = true
passenv =
   GITHUB_*
   COVERALLS_*
   DISPLAY
   XAUTHORITY

[testenv:linting{,-ci}]
description = run ruff linter
dependency_groups = lint
commands =
   linting: ruff check
   linting-ci: ruff check --output-format=github
skip_install = true

[testenv:formatting]
description = run ruff formatter
dependency_groups = lint
commands =
   ruff format --check
skip_install = true

[testenv:typing-py31{0-4}]
description = run mypy type checker on python {py_dot_ver}
depends = linting{posargs}, formatting
dependency_groups = typing, test
commands = mypy --python-version {py_dot_ver} --always-false=PYQT5 --always-false=PYSIDE2 --always-false=PYQT6 --always-true=PYSIDE6
skip_install = true

[testenv:clean]
description = clean up coverage files
depends = linting{posargs}, formatting
commands = coverage erase
skip_install = true

[testenv:doctest]
description = test code in Sphinx documentation
dependency_groups = doc, test
commands =
    python -c "import shutil; shutil.rmtree('docs/source/api', ignore_errors=True)"
    sphinx-build -b doctest -D autosummary_generate=0 -d {toxworkdir}/doctrees docs/source {envtmpdir}

[testenv:py31{0-4}{,-ci}]
description = run pytest on python {py_dot_ver}
depends = clean
dependency_groups =
   test
   py310-ci, py311-ci, py312-ci, py313-ci, py314-ci: ci
commands =
   pytest
   py310-ci, py311-ci, py312-ci, py313-ci, py314-ci: - coveralls

[testenv:combine]
description = combine coverage files
depends = py3{10-14}{posargs}
setenv = COVERAGE_FILE = .coverage
commands = coverage combine
skip_install = true
